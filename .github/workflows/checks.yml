name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The checks that gate the corpus are themselves code, and until now
      # nothing checked them. Lint and types first because they are fast and
      # catch the mistake before the 58-text run does.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q
      # …and then the corpus itself, which is what this repository is for.
      - run: python run_checks.py --all
