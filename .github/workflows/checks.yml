name: checks

on:
  push:
    branches: [main, '*-gate']
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The checks that gate the corpus are themselves code, and until now
      # nothing checked them. Lint and types first because they are fast and
      # catch the mistake before the 58-text run does.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q
      # The house layout, so that a diff over a text stays readable. It had
      # already slipped in five files kept by hand.
      - run: python -m checks.layout --check
      # …and then the corpus itself, which is what this repository is for.
      - run: python run_checks.py --all
      # The reader edition must lose nothing and must rebuild byte for byte.
      - run: python build.py --check
