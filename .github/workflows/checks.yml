name: checks

on:
  push:
    branches: [main, '*-gate']
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: the identity check
      # compares every word id against a base commit, and a clone with no
      # base to name turned that comparison into HEAD against itself — a
      # verifier that ran, printed, and could not fail. Found by an external
      # review on 2026-08-19.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The checks that gate the corpus are themselves code, and until now
      # nothing checked them. Lint and types first because they are fast and
      # catch the mistake before the 58-text run does.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q
      # The house layout, so that a diff over a text stays readable. It had
      # already slipped in five files kept by hand.
      - run: python -m checks.layout --check
      # Which commit the identity check compares against. A push names the
      # tip it replaced; a pull request names its base branch; a branch with
      # no before (its first push) falls back to main. Without this the
      # default was HEAD, and in CI the tree IS HEAD, so the one check whose
      # failure mode its own docstring calls unrecoverable — an id renumbered
      # under every reference that resolves to it — compared each file with
      # itself and passed on anything.
      - name: name the base the identity check compares against
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse origin/main)"
          fi
          echo "SCRUTABOR_BASE=$base" >> "$GITHUB_ENV"
          echo "identity will be compared against $base"
      # …and then the corpus itself, which is what this repository is for.
      - run: python run_checks.py --all
        env:
          SCRUTABOR_BASE: ${{ env.SCRUTABOR_BASE }}
      # The reader edition must lose nothing and must rebuild byte for byte.
      - run: python build.py --check
      # The analysis provenance, held by the agreement machine. The pipeline
      # repository runs the same report on its own pushes to prove the
      # machine works; THIS step runs it with --strict because a word that
      # names an analyzer the analyzer contradicts is this repository's
      # defect — 67 such words shipped on 2026-08-18 and nothing here could
      # go red for them. The clone is the pipeline's main, shallow, and the
      # analyzers install from its own pinned requirements.
      - name: the analyzers confirm what the corpus claims
        run: |
          git clone --depth 1 https://github.com/scrutabor/scrutabor-pipeline.git /tmp/pipeline
          pip install -r /tmp/pipeline/requirements.txt
          pip install /tmp/pipeline
          python -m scrutabor_pipeline.agreement --strict .
